[package]
name = "alice-navigation"
version = "1.0.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Autonomous navigation: RRT, PRM, potential field, obstacle avoidance, path smoothing, waypoint following, velocity obstacles, navigation mesh, dynamic replanning"

[lib]
crate-type = ["rlib"]

[features]
# Conservative reachability over a signed distance field (`sdf_reach`). The field is
# alice-physics' `SdfField`, which alice-sdf's `CompiledSdf` and `LiveSdf` implement.
sdf-field = ["dep:alice-physics"]

[dependencies]
# Angles (velocity candidates) through deterministic math, not the platform libm; the same
# source (branch main) alice-physics and alice-sdf use, so one alice-det-math is linked.
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", branch = "main", version = "0.6" }
# The same source alice-sdf uses (branch main): alice-physics from another source is a
# different crate, and alice-sdf's `SdfField` impls would not satisfy this one.
alice-physics = { git = "https://github.com/ext-sakamoro/ALICE-Physics", branch = "main", version = "4", default-features = false, features = ["std"], optional = true }

[[example]]
name = "sdf_reach"
required-features = ["sdf-field"]
