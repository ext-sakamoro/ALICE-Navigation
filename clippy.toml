# Determinism gate: every result of this crate is a pure function of its input bits on every
# target (x86_64, aarch64, wasm32). The platform libm transcendentals and `hypot` differ between
# targets in the last bits, so distances use + − × ÷ and sqrt only (correctly rounded by IEEE 754)
# and angles go through alice-det-math. `mul_add` is correctly rounded and stays allowed.
disallowed-methods = [
    { path = "f64::sin", reason = "platform libm, not bit-identical across targets; use the alice_det_math function" },
    { path = "f64::cos", reason = "platform libm, not bit-identical across targets; use the alice_det_math function" },
    { path = "f64::tan", reason = "platform libm, not bit-identical across targets; use the alice_det_math function" },
    { path = "f64::sin_cos", reason = "platform libm, not bit-identical across targets; use the alice_det_math function" },
    { path = "f64::asin", reason = "platform libm, not bit-identical across targets; use the alice_det_math function" },
    { path = "f64::acos", reason = "platform libm, not bit-identical across targets; use the alice_det_math function" },
    { path = "f64::atan", reason = "platform libm, not bit-identical across targets; use the alice_det_math function" },
    { path = "f64::atan2", reason = "platform libm, not bit-identical across targets; use the alice_det_math function" },
    { path = "f64::sinh", reason = "platform libm, not bit-identical across targets; add it to alice-det-math before using it here" },
    { path = "f64::cosh", reason = "platform libm, not bit-identical across targets; add it to alice-det-math before using it here" },
    { path = "f64::tanh", reason = "platform libm, not bit-identical across targets; use the alice_det_math function" },
    { path = "f64::asinh", reason = "platform libm, not bit-identical across targets; add it to alice-det-math before using it here" },
