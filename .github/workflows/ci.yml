name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  test:
    name: Clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the reach witness hash (tests/sdf_reach_oracle.rs) must be the same on every platform
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # the passed-test count at the commit that set it, all features on; fewer passed tests (a
      # removed or skipped test, or none at all) is a failure
      MIN_PASSED: "152"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (all targets, -D warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (all targets, all features, -D warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Passed tests are at least MIN_PASSED
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$log"
          passed=$(grep -E '^test result: ' "$log" | awk '{s += $4} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED})"
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi

  wasm:
    name: Reach and search oracles on wasm32-wasip1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # the oracles in tests/sdf_reach_oracle.rs, tests/graph_search_oracle.rs and
      # tests/determinism_oracle.rs, including their witness, path and waypoint hashes (the `should_panic` tests are skipped: wasm32 has no unwinding)
      MIN_PASSED: "46"
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Passed tests are at least MIN_PASSED
        run: |
          set -o pipefail
          rustup target add wasm32-wasip1
          log="$(mktemp)"
          cargo test --locked --target wasm32-wasip1 --features sdf-field --test sdf_reach_oracle --test graph_search_oracle --test determinism_oracle 2>&1 | tee "$log"
          passed=$(grep -E '^test result: ' "$log" | awk '{s += $4} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED})"
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

