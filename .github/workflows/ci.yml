name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  test:
    name: Clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the reach witness hash (tests/sdf_reach_oracle.rs) must be the same on every platform
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # the passed-test count at the commit that set it, all features on; fewer passed tests (a
      # removed or skipped test, or none at all) is a failure
      MIN_PASSED: "152"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (all targets, -D warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (all targets, all features, -D warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Passed tests are at least MIN_PASSED
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$log"
          passed=$(grep -E '^test result: ' "$log" | awk '{s += $4} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED})"
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi

  wasm:
    name: Reach and search oracles on wasm32-wasip1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # the oracles in tests/sdf_reach_oracle.rs, tests/graph_search_oracle.rs and
      # tests/determinism_oracle.rs, including their witness, path and waypoint hashes (the `should_panic` tests are skipped: wasm32 has no unwinding)
      MIN_PASSED: "46"
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # wasmtime at a pinned version and checksum: the setup action takes "latest" (once without
      # assets yet) and its download host once answered 504; the binary is cached by version and
      # the download retried, a mismatching checksum fails
      - name: Cache wasmtime
        id: wasmtime-cache
        uses: actions/cache@v6
        with:
          path: ~/.wasmtime-v49.0.2
          key: wasmtime-v49.0.2-x86_64-linux
      - name: Install wasmtime
        if: steps.wasmtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/wasmtime-v49.0.2-x86_64-linux.tar.xz
          mkdir -p ~/.wasmtime-v49.0.2
          # first source: the release tarball, checked against its recorded SHA-256
          if curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o "$RUNNER_TEMP/wasmtime.tar.xz" "$url"; then
            echo "a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C ~/.wasmtime-v49.0.2 --strip-components=1
          else
            # second source when the release host keeps failing: the same version from crates.io,
            # with the crate's own lock file (cargo checks every downloaded crate's checksum)
            echo "release download failed; building wasmtime-cli 49.0.2 from crates.io"
            cargo install wasmtime-cli --version 49.0.2 --locked --root "$RUNNER_TEMP/wasmtime-cli"
            cp "$RUNNER_TEMP/wasmtime-cli/bin/wasmtime" ~/.wasmtime-v49.0.2/wasmtime
          fi
      - name: Check wasmtime runs
        shell: bash
        run: |
          echo "$HOME/.wasmtime-v49.0.2" >> "$GITHUB_PATH"
          "$HOME/.wasmtime-v49.0.2/wasmtime" --version
      - name: Passed tests are at least MIN_PASSED
        run: |
          set -o pipefail
          rustup target add wasm32-wasip1
          log="$(mktemp)"
          cargo test --locked --target wasm32-wasip1 --features sdf-field --test sdf_reach_oracle --test graph_search_oracle --test determinism_oracle 2>&1 | tee "$log"
          passed=$(grep -E '^test result: ' "$log" | awk '{s += $4} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED})"
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

